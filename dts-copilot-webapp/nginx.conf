server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files /index.html =404;
    }

    location = /assets {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files /index.html =404;
    }

    location ~ ^/assets/.+\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @stale_asset_chunk;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location @stale_asset_chunk {
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        return 200 "window.location.reload(); export default function StaleChunkReload(){ return null; }\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ai/ {
        proxy_pass http://copilot-ai:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://copilot-analytics:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
